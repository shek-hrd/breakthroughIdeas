<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>breakthroughIdeas — shek-hrd · GitHub Ideas Sphere</title>

<!-- Tailwind: the mindmap component styles its layout with utility classes
     (h-screen, h-full, flex-col, min-h-0 …). Without it every container
     collapses to 0px and the ball never appears. -->
<script src="https://cdn.tailwindcss.com/3.4.16"></script>

<style>
  html, body { margin:0; padding:0; height:100%; background:#0a100e; }
  body { overflow:hidden; }

  /* ---- view switcher bar ---- */
  #viewbar {
    position: fixed; top:0; left:0; right:0; height:44px; z-index:9999;
    display:flex; align-items:center; gap:8px; padding:0 12px;
    background:#0b1210; border-bottom:1px solid rgba(110,231,183,.18);
    font-family:'Segoe UI',Tahoma,sans-serif;
  }
  #viewbar .brand {
    color:#6ee7b7; font-weight:300; letter-spacing:.04em; font-size:13px;
    margin-right:6px; white-space:nowrap; text-decoration:none;
  }
  #viewbar .brand b { font-weight:600; }
  #viewbar .vbtn {
    appearance:none; border:1px solid rgba(255,255,255,.2); background:transparent;
    color:rgba(255,255,255,.55); font:inherit; font-size:12px;
    padding:4px 12px; border-radius:999px; cursor:pointer; transition:all .2s;
  }
  #viewbar .vbtn:hover { color:#fff; border-color:rgba(110,231,183,.6); }
  #viewbar .vbtn.active {
    color:#0a100e; background:#6ee7b7; border-color:#6ee7b7; font-weight:600;
  }
  #viewbar .right { margin-left:auto; color:rgba(255,255,255,.35); font-size:11px; white-space:nowrap; }
  #viewbar .right a { color:rgba(110,231,183,.75); text-decoration:none; }
  #viewbar .right a:hover { color:#6ee7b7; }

  /* ---- panes ---- */
  .pane { position:absolute; top:44px; bottom:0; left:0; right:0; }
  /* The sphere host must have a real height: the component measures itself
     with a ResizeObserver and draws into that box. */
  #sphere-pane  { height:calc(100% - 44px); width:100%; overflow:hidden; }
  #ideas-sphere { height:100%; width:100%; overflow:hidden; }
  /* The app's own root asks for h-screen (100vh), but it lives inside the
     pane below the 44px bar — pin it to the pane so nothing is clipped. */
  #ideas-sphere > div { height:100% !important; }
  #portfolio-pane { display:none; }
  #portfolio-pane iframe { width:100%; height:100%; border:0; display:block; }
  body.view-portfolio #portfolio-pane { display:block; }
  body.view-portfolio #sphere-pane    { display:none; }

  /* ---- critical layout fallback ----
     The component styles itself with Tailwind utilities. If the Tailwind CDN
     is blocked or slow, these rules keep the sphere box measurable so the
     ball still draws. Cosmetic classes degrade; layout never does. */
  .flex{display:flex} .inline-block{display:inline-block} .block{display:block}
  .hidden{display:none} .grid{display:grid} .inline-flex{display:inline-flex}
  .flex-col{flex-direction:column} .flex-row{flex-direction:row}
  .flex-wrap{flex-wrap:wrap} .flex-1{flex:1 1 0%} .shrink-0{flex-shrink:0}
  .items-center{align-items:center} .items-start{align-items:flex-start}
  .items-baseline{align-items:baseline} .justify-center{justify-content:center}
  .justify-between{justify-content:space-between} .self-center{align-self:center}
  .h-screen{height:100vh} .h-full{height:100%} .w-full{width:100%}
  .min-h-0{min-height:0} .min-w-0{min-width:0} .w-max{width:max-content}
  .relative{position:relative} .absolute{position:absolute} .inset-0{inset:0}
  .overflow-hidden{overflow:hidden} .overflow-y-auto{overflow-y:auto}
  .overflow-x-auto{overflow-x:auto} .touch-none{touch-action:none}
  .select-none{user-select:none} .pointer-events-none{pointer-events:none}
  .text-center{text-align:center} .text-left{text-align:left}
  .whitespace-nowrap{white-space:nowrap} .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .uppercase{text-transform:uppercase} .italic{font-style:italic} .underline{text-decoration:underline}
  .gap-1{gap:.25rem} .gap-1\.5{gap:.375rem} .gap-2{gap:.5rem} .gap-3{gap:.75rem}
  .p-1\.5{padding:.375rem} .p-2{padding:.5rem} .p-3{padding:.75rem}
  .px-2{padding-left:.5rem;padding-right:.5rem} .py-1{padding-top:.25rem;padding-bottom:.25rem}
  .mt-1{margin-top:.25rem} .mt-2{margin-top:.5rem} .mb-1{margin-bottom:.25rem}
  .mx-auto{margin-left:auto;margin-right:auto} .ml-auto{margin-left:auto}
  .rounded{border-radius:.25rem} .rounded-full{border-radius:9999px}
  .border{border-width:1px;border-style:solid}
  .text-xs{font-size:.75rem;line-height:1rem} .text-sm{font-size:.875rem;line-height:1.25rem}
  .font-mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  /* ---- boot / error states ---- */
  #boot {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; z-index:50;
    background:#0a100e; color:rgba(255,255,255,.45); text-align:center;
    font:12px/1.6 'Segoe UI',Tahoma,sans-serif; transition:opacity .4s ease;
  }
  #boot .ring {
    width:34px; height:34px; border-radius:50%;
    border:2px solid rgba(110,231,183,.2); border-top-color:#6ee7b7;
    animation:spin 1s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  #boot.hidden { opacity:0; pointer-events:none; }
  #boot pre {
    max-width:760px; margin:0; padding:10px 14px; text-align:left;
    background:rgba(255,80,80,.08); border:1px solid rgba(255,120,120,.25);
    border-radius:8px; color:#ffb4b4; white-space:pre-wrap; word-break:break-word;
  }
</style>
</head>
<body class="view-sphere">

  <nav id="viewbar">
    <a class="brand" href="https://github.com/shek-hrd" target="_blank" rel="noreferrer">shek-hrd · <b>breakthroughIdeas</b></a>
    <button class="vbtn active" id="tab-sphere"    onclick="setView('sphere')">◉ repository mindmap</button>
    <button class="vbtn"        id="tab-portfolio" onclick="setView('portfolio')">▤ portfolio (latest page)</button>
    <span class="right">idea-sphere/v1 · <a href="https://github.com/shek-hrd/breakthroughIdeas" target="_blank" rel="noreferrer">repo ↗</a></span>
  </nav>

  <div id="sphere-pane" class="pane">
    <div id="ideas-sphere"></div>
    <div id="boot">
      <div class="ring"></div>
      <span>building the ideas sphere…</span>
    </div>
  </div>

  <div id="portfolio-pane" class="pane">
    <iframe src="portfolio.html" title="breakthroughIdeas portfolio (previous latest page)"></iframe>
  </div>

<script>
  function setView(v) {
    var portfolio = (v === 'portfolio');
    document.body.classList.toggle('view-portfolio', portfolio);
    document.body.classList.toggle('view-sphere', !portfolio);
    document.getElementById('tab-sphere').classList.toggle('active', !portfolio);
    document.getElementById('tab-portfolio').classList.toggle('active', portfolio);
  }

  function bootError(msg) {
    var b = document.getElementById('boot');
    if (!b) return;
    b.classList.remove('hidden');
    b.innerHTML = '';
    var t = document.createElement('span');
    t.textContent = 'The mindmap could not start:';
    var pre = document.createElement('pre');
    pre.textContent = String(msg);
    var hint = document.createElement('span');
    hint.textContent = 'This page needs internet access for React and Tailwind.';
    b.appendChild(t); b.appendChild(pre); b.appendChild(hint);
  }

  window.addEventListener('error', function (e) {
    if (e && e.message) bootError(e.message);
  });
</script>

<!-- React (UMD builds expose globals: React, ReactDOM) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<!-- mindmap component: precompiled from breakthroughIdeas.jsx, self-mounts into #ideas-sphere -->
<script src="breakthroughIdeas.js" onerror="bootError('breakthroughIdeas.js failed to load')"></script>

<script>
  // React 18 renders asynchronously; give it a moment, then hide the splash.
  // If nothing mounted, surface a readable error instead of an empty screen.
  setTimeout(function () {
    var host = document.getElementById('ideas-sphere');
    var hasChild = host && host.childElementCount > 0;
    if (hasChild) {
      var b = document.getElementById('boot');
      if (b) b.classList.add('hidden');
    } else {
      bootError('React mounted nothing into #ideas-sphere (check that the React and Tailwind CDN scripts loaded).');
    }
  }, 2500);
</script>
</body>
</html>
